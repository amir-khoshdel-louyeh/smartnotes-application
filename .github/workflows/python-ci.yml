name: Python CI

on:
  push:
    branches: [main, master, local_commit]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff black mypy
      - run: ruff check . --output-format=github
      - run: black --check --line-length 100 .
      - run: mypy services view --ignore-missing-imports --explicit-package-bases

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Install system deps for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 xvfb
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests with pytest (xvfb + offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a python -m pytest tests -q --cov=. --cov-report=term-missing --cov-report=xml
      - name: Security audit
        run: |
          pip install pip-audit
          pip-audit --desc || true
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
