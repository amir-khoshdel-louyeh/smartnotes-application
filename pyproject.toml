[project]
name = "smartnotes-application"
version = "0.2.0"
description = "StudyMate – lightweight PyQt5 notes, PDF viewer and AI summarizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt5>=5.15.10",
    "python-docx>=1.1.2",
    "pypdf>=4.0",
    "PyMuPDF>=1.23",
    "odfpy>=1.4.1",
    "torch>=2.4",
    "transformers>=4.41",
    "requests>=2.32",
    "matplotlib>=3.8.1",
    "networkx>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["services", "view"]
omit = ["tests/*", "view/__pycache__/*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
