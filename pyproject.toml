[project]
name = "smartnotes-application"
version = "0.2.0"
description = "StudyMate – lightweight PyQt5 notes, PDF viewer and AI summarizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt5>=5.15.10",
    "python-docx>=1.1.2",
    "pypdf>=4.0",
    "PyMuPDF>=1.23",
    "odfpy>=1.4.1",
    "torch>=2.4",
    "transformers>=4.41",
    "requests>=2.32",
    "matplotlib>=3.8.1",
    "networkx>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-qt>=4.4",
    "pytest-mock>=3.12",
    "ruff>=0.8",
    "black>=24.0",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["services", "view"]
omit = ["tests/*", "view/__pycache__/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
